services:
  - type: web
    name: welfareconnect
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: welfareconnect-db
          property: connectionString

databases:
  - name: welfareconnect-db
    databaseName: welfare_db
    user: welfare_user
    plan: free

